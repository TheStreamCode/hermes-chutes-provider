version: 2
updates:
  # Majors are deliberately left out of every group: they stay individual pull
  # requests so a breaking bump is never bundled with routine ones.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      pip-production:
        dependency-type: production
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
